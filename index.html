<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Endereço MAC e Serial</title>
    <link rel="icon" type="image/x-icon" href="https://sistemas.wuaze.com/Img/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Conversor de Endereço MAC e Serial</h1>
        
        <!-- Tabs -->
        <div class="flex border-b border-gray-300 mb-6">
            <button
                id="macTab"
                class="flex-1 py-2 px-4 text-center font-medium text-blue-600 border-b-2 border-blue-600"
                onclick="switchTab('mac')"
            >
                Conversor MAC
            </button>
            <button
                id="serialTab"
                class="flex-1 py-2 px-4 text-center font-medium text-gray-600 border-b-2 border-transparent hover:text-blue-600"
                onclick="switchTab('serial')"
            >
                Concatenar Serial
            </button>
        </div>

        <!-- MAC Converter Tab -->
        <div id="macContent" class="tab-content">
            <div class="mb-4">
                <label for="macInput" class="block text-sm font-medium text-gray-700 mb-2">
                    Insira o Endereço MAC (ex.: FHTT10889E48)
                </label>
                <input
                    type="text"
                    id="macInput"
                    placeholder="FHTT10889E48"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
            </div>
            <button
                onclick="convertMac()"
                class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition duration-200"
            >
                Converter
            </button>
            <div id="result" class="mt-6 text-center">
                <p class="text-gray-700">Endereço MAC Convertido:</p>
                <div class="flex items-center justify-center mt-2">
                    <p id="output" class="text-lg font-mono text-gray-900"></p>
                    <button
                        id="copyButton"
                        onclick="copyMac()"
                        class="ml-4 bg-gray-200 text-gray-800 px-3 py-1 rounded-md hover:bg-gray-300 transition duration-200 hidden flex items-center"
                    >
                        <img src="https://sistemas.wuaze.com/Img/icon.png" alt="Favicon do site" class="w-4 h-4 mr-1">
                        Copiar
                    </button>
                </div>
                <p id="copyFeedback" class="text-sm text-green-600 mt-2 hidden">Copiado para a área de transferência!</p>
            </div>
        </div>

        <!-- Serial Concatenation Tab -->
        <div id="serialContent" class="tab-content hidden">
            <div class="mb-4">
                <label for="modelSelect" class="block text-sm font-medium text-gray-700 mb-2">
                    Selecione o Modelo
                </label>
                <select
                    id="modelSelect"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                    <option value="Intelbras">Intelbras (49544253)</option>
                    <option value="FiberHome">FiberHome (46485454)</option>
                    <option value="Easy4link">Easy 4link (46485454)</option>
                    <option value="ZTE">ZTE (5A544547)</option>
                    <option value="VSOL">VSOL (47504F4E)</option>
                    <option value="Nokia">Nokia (4E42454C)</option>
                    <option value="Multilaser">Multilaser (44443136)</option>
                    <option value="Alcatel">Alcatel (414C434C)</option>
                    <option value="Tenda">Tenda (32303037)</option>
                    <option value="Monu">Monu (4D4F4E55)</option>
                    <option value="Ubiquiti">Ubiquiti (55424E54)</option>
                    <option value="Huawei">Huawei (48575443)</option>
                </select>
            </div>
            <div class="mb-4">
                <label for="serialInput" class="block text-sm font-medium text-gray-700 mb-2">
                    Insira o Serial/MAC (ex.: ZTEGD5F27DBF)
                </label>
                <input
                    type="text"
                    id="serialInput"
                    placeholder="ZTEGD5F27DBF"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
            </div>
            <button
                onclick="concatenateSerial()"
                class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition duration-200"
            >
                Concatenar
            </button>
            <div id="serialResult" class="mt-6 text-center">
                <p class="text-gray-700">Serial Concatenado:</p>
                <div class="flex items-center justify-center mt-2">
                    <p id="serialOutput" class="text-lg font-mono text-gray-900"></p>
                    <button
                        id="copySerialButton"
                        onclick="copySerial()"
                        class="ml-4 bg-gray-200 text-gray-800 px-3 py-1 rounded-md hover:bg-gray-300 transition duration-200 hidden flex items-center"
                    >
                        <img src="https://sistemas.wuaze.com/Img/icon.png" alt="Favicon do site" class="w-4 h-4 mr-1">
                        Copiar
                    </button>
                </div>
                <p id="serialCopyFeedback" class="text-sm text-green-600 mt-2 hidden">Copiado para a área de transferência!</p>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function loadFileData(filename) {
            if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
                try {
                    var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                    var firstSheetName = workbook.SheetNames[0];
                    var worksheet = workbook.Sheets[firstSheetName];
                    var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                    var filteredData = jsonData.filter(row =>
                        row.some(cell => cell !== '' && cell !== null && cell !== undefined)
                    );
                    var csv = XLSX.utils.aoa_to_sheet(filteredData);
                    csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                    return csv;
                } catch (e) {
                    console.error(e);
                    return "";
                }
            }
            return gk_fileData[filename] || "";
        }

        // Tab switching
        function switchTab(tab) {
            const macTab = document.getElementById('macTab');
            const serialTab = document.getElementById('serialTab');
            const macContent = document.getElementById('macContent');
            const serialContent = document.getElementById('serialContent');

            if (tab === 'mac') {
                macTab.classList.add('text-blue-600', 'border-blue-600');
                macTab.classList.remove('text-gray-600', 'border-transparent');
                serialTab.classList.add('text-gray-600', 'border-transparent');
                serialTab.classList.remove('text-blue-600', 'border-blue-600');
                macContent.classList.remove('hidden');
                serialContent.classList.add('hidden');
            } else {
                serialTab.classList.add('text-blue-600', 'border-blue-600');
                serialTab.classList.remove('text-gray-600', 'border-transparent');
                macTab.classList.add('text-gray-600', 'border-transparent');
                macTab.classList.remove('text-blue-600', 'border-blue-600');
                serialContent.classList.remove('hidden');
                macContent.classList.add('hidden');
            }
        }

        // MAC Converter Functions
        function convertMac() {
            const input = document.getElementById('macInput').value.trim().toUpperCase();
            const output = document.getElementById('output');
            const copyButton = document.getElementById('copyButton');
            const copyFeedback = document.getElementById('copyFeedback');

            const cleanInput = input.replace(/[^A-Z0-9]/gi, '');
            if (cleanInput.length !== 12) {
                output.textContent = 'Endereço MAC inválido! Insira exatamente 12 caracteres alfanuméricos.';
                output.classList.add('text-red-600');
                copyButton.classList.add('hidden');
                copyFeedback.classList.add('hidden');
                return;
            }

            const formattedMac = cleanInput.match(/.{1,2}/g).join(':');
            output.textContent = formattedMac;
            output.classList.remove('text-red-600');
            copyButton.classList.remove('hidden');
            copyFeedback.classList.add('hidden');
        }

        function copyMac() {
            const output = document.getElementById('output').textContent;
            const copyFeedback = document.getElementById('copyFeedback');

            navigator.clipboard.writeText(output).then(() => {
                copyFeedback.classList.remove('hidden');
                setTimeout(() => {
                    copyFeedback.classList.add('hidden');
                }, 2000);
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
                copyFeedback.textContent = 'Erro ao copiar!';
                copyFeedback.classList.remove('hidden');
                copyFeedback.classList.add('text-red-600');
                setTimeout(() => {
                    copyFeedback.classList.add('hidden');
                    copyFeedback.classList.remove('text-red-600');
                    copyFeedback.textContent = 'Copiado para a área de transferência!';
                }, 2000);
            });
        }

        // Serial Concatenation Functions
        const modelConfig = {
            'Intelbras': { prefix: '49544253', inputPrefix: 'INTB' },
            'FiberHome': { prefix: '46485454', inputPrefix: 'FHTT' },
            'Easy4link': { prefix: '46485454', inputPrefix: 'EASY' },
            'ZTE': { prefix: '5A544547', inputPrefix: 'ZTEG' },
            'VSOL': { prefix: '47504F4E', inputPrefix: 'VSOL' },
            'Nokia': { prefix: '4E42454C', inputPrefix: 'NOKI' },
            'Multilaser': { prefix: '44443136', inputPrefix: 'MULT' },
            'Alcatel': { prefix: '414C434C', inputPrefix: 'ALCL' },
            'Tenda': { prefix: '32303037', inputPrefix: 'TEND' },
            'Monu': { prefix: '4D4F4E55', inputPrefix: 'MONU' },
            'Ubiquiti': { prefix: '55424E54', inputPrefix: 'UBNT' },
            'Huawei': { prefix: '48575443', inputPrefix: 'HWTC' }
        };

        function concatenateSerial() {
            const model = document.getElementById('modelSelect').value;
            const serialInput = document.getElementById('serialInput').value.trim().toUpperCase();
            const serialOutput = document.getElementById('serialOutput');
            const copySerialButton = document.getElementById('copySerialButton');
            const serialCopyFeedback = document.getElementById('serialCopyFeedback');

            const cleanSerial = serialInput.replace(/[^A-Z0-9]/gi, '');
            const config = modelConfig[model] || {};
            const inputPrefix = config.inputPrefix || '';
            const expectedLength = inputPrefix.length + 8; // 4 (prefix) + 8 (serial)

            // Check if input length is valid
            if (cleanSerial.length !== expectedLength || !cleanSerial.startsWith(inputPrefix)) {
                serialOutput.textContent = `Serial/MAC inválido! Insira um serial com o prefixo ${inputPrefix} seguido de 8 caracteres alfanuméricos.`;
                serialOutput.classList.add('text-red-600');
                copySerialButton.classList.add('hidden');
                serialCopyFeedback.classList.add('hidden');
                return;
            }

            // Remove the input prefix and concatenate with the model prefix
            const serialWithoutPrefix = cleanSerial.slice(inputPrefix.length);
            const concatenated = config.prefix + serialWithoutPrefix;
            serialOutput.textContent = concatenated;
            serialOutput.classList.remove('text-red-600');
            copySerialButton.classList.remove('hidden');
            serialCopyFeedback.classList.add('hidden');
        }

        function copySerial() {
            const serialOutput = document.getElementById('serialOutput').textContent;
            const serialCopyFeedback = document.getElementById('serialCopyFeedback');

            navigator.clipboard.writeText(serialOutput).then(() => {
                serialCopyFeedback.classList.remove('hidden');
                setTimeout(() => {
                    serialCopyFeedback.classList.add('hidden');
                }, 2000);
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
                serialCopyFeedback.textContent = 'Erro ao copiar!';
                serialCopyFeedback.classList.remove('hidden');
                serialCopyFeedback.classList.add('text-red-600');
                setTimeout(() => {
                    serialCopyFeedback.classList.add('hidden');
                    serialCopyFeedback.classList.remove('text-red-600');
                    serialCopyFeedback.textContent = 'Copiado para a área de transferência!';
                }, 2000);
            });
        }

        // Event Listeners
        document.getElementById('macInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                convertMac();
            }
        });

        document.getElementById('serialInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                concatenateSerial();
            }
        });
    </script>
</body>
</html>
