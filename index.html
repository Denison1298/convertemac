<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de MAC e Serial</title>
    <link rel="icon" type="image/x-icon" href="https://sistemas.wuaze.com/Img/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
        }
        .tab-button {
            transition: all 0.3s ease;
        }
        .tab-button.active {
            color: #295ba5;
            border-bottom: 3px solid #295ba5;
        }
        .tab-button:hover {
            color: #295ba5;
            background-color: #dadf3f;
        }
        .input-field {
            transition: all 0.2s ease;
        }
        .input-field:focus {
            border-color: #295ba5;
            box-shadow: 0 0 0 3px rgba(41, 91, 165, 0.2);
        }
        .primary-button {
            background-color: #295ba5;
        }
        .primary-button:hover {
            background-color: #1e4687;
        }
        .copy-button {
            background-color: #dadf3f;
            color: #333;
        }
        .copy-button:hover {
            background-color: #c8cc2f;
        }
        .copy-feedback {
            background-color: #dadf3f;
            padding: 0.5rem;
            border-radius: 0.375rem;
        }
        .error-text {
            background-color: rgba(255, 0, 0, 0.1);
            padding: 0.5rem;
            border-radius: 0.375rem;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-10 rounded-xl shadow-xl w-full max-w-lg">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Conversor de MAC e Serial</h1>
        
        <!-- Tabs -->
        <div class="flex border-b border-gray-200 mb-8">
            <button
                id="macTab"
                class="tab-button flex-1 py-3 px-6 text-center font-medium text-blue-600 border-b-2 border-blue-600 active"
                onclick="switchTab('mac')"
            >
                Conversor MAC
            </button>
            <button
                id="serialTab"
                class="tab-button flex-1 py-3 px-6 text-center font-medium text-gray-600 border-b-2 border-transparent"
                onclick="switchTab('serial')"
            >
                Conversor MAC para SN
            </button>
        </div>

        <!-- MAC Converter Tab -->
        <div id="macContent" class="tab-content">
            <div class="mb-6">
                <label for="macInput" class="block text-sm font-medium text-gray-700 mb-2">
                    Insira o Endereço MAC: 
                </label>
                <input
                    type="text"
                    id="macInput"
                    placeholder=""
                    class="input-field w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none"
                />
            </div>
            <button
                onclick="convertMac()"
                class="primary-button w-full text-white py-3 rounded-lg transition duration-200"
            >
                Converter
            </button>
            <div id="result" class="mt-8 text-center">
                <p class="text-gray-700 font-medium">Endereço MAC Convertido:</p>
                <div class="flex items-center justify-center mt-3">
                    <p id="output" class="text-lg font-mono text-gray-900"></p>
                    <button
                        id="copyButton"
                        onclick="copyMac()"
                        class="copy-button ml-4 px-4 py-2 rounded-lg hidden flex items-center"
                    >
                        <img src="https://sistemas.wuaze.com/Img/icon.png" alt="Favicon do site" class="w-4 h-4 mr-2">
                        Copiar
                    </button>
                </div>
                <p id="copyFeedback" class="copy-feedback text-sm text-gray-800 mt-3 hidden">Copiado para a área de transferência!</p>
            </div>
        </div>

        <!-- Serial Converter Tab -->
        <div id="serialContent" class="tab-content hidden">
            <div class="mb-6">
                <label for="modelSelect" class="block text-sm font-medium text-gray-700 mb-2">
                    Selecione o Modelo
                </label>
                <select
                    id="modelSelect"
                    class="input-field w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none"
                >
                    <option value="Intelbras">Intelbras (49544253)</option>
                    <option value="FiberHome">FiberHome (46485454)</option>
                    <option value="Easy4link">Easy 4link (46485454)</option>
                    <option value="ZTE">ZTE (5A544547)</option>
                    <option value="VSOL">VSOL (47504F4E)</option>
                    <option value="Nokia">Nokia (4E42454C)</option>
                    <option value="Multilaser">Multilaser (44443136)</option>
                    <option value="Alcatel">Alcatel (414C434C)</option>
                    <option value="Tenda">Tenda (32303037)</option>
                    <option value="Monu">Monu (4D4F4E55)</option>
                    <option value="Ubiquiti">Ubiquiti (55424E54)</option>
                    <option value="Huawei">Huawei (48575443)</option>
                </select>
            </div>
            <div class="mb-6">
                <label for="serialInput" class="block text-sm font-medium text-gray-700 mb-2">
                    Insira o MAC:
                </label>
                <input
                    type="text"
                    id="serialInput"
                    placeholder=""
                    class="input-field w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none"
                />
            </div>
            <button
                onclick="convertToSerialNumber()"
                class="primary-button w-full text-white py-3 rounded-lg transition duration-200"
            >
                Converter para SN
            </button>
            <div id="serialResult" class="mt-8 text-center">
                <p class="text-gray-700 font-medium">Número de Série (SN):</p>
                <div class="flex items-center justify-center mt-3">
                    <p id="serialOutput" class="text-lg font-mono text-gray-900"></p>
                    <button
                        id="copySerialButton"
                        onclick="copySerial()"
                        class="copy-button ml-4 px-4 py-2 rounded-lg hidden flex items-center"
                    >
                        <img src="https://sistemas.wuaze.com/Img/icon.png" alt="Favicon do site" class="w-4 h-4 mr-2">
                        Copiar
                    </button>
                </div>
                <p id="serialCopyFeedback" class="copy-feedback text-sm text-gray-800 mt-3 hidden">Copiado para a área de transferência!</p>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        // Tab switching
        function switchTab(tab) {
            const macTab = document.getElementById('macTab');
            const serialTab = document.getElementById('serialTab');
            const macContent = document.getElementById('macContent');
            const serialContent = document.getElementById('serialContent');

            if (tab === 'mac') {
                macTab.classList.add('text-blue-600', 'border-blue-600', 'active');
                macTab.classList.remove('text-gray-600', 'border-transparent');
                serialTab.classList.add('text-gray-600', 'border-transparent');
                serialTab.classList.remove('text-blue-600', 'border-blue-600', 'active');
                macContent.classList.remove('hidden');
                serialContent.classList.add('hidden');
            } else {
                serialTab.classList.add('text-blue-600', 'border-blue-600', 'active');
                serialTab.classList.remove('text-gray-600', 'border-transparent');
                macTab.classList.add('text-gray-600', 'border-transparent');
                macTab.classList.remove('text-blue-600', 'border-blue-600', 'active');
                serialContent.classList.remove('hidden');
                macContent.classList.add('hidden');
            }
        }

        // MAC Converter Functions
        function convertMac() {
            const input = document.getElementById('macInput').value.trim().toUpperCase();
            const output = document.getElementById('output');
            const copyButton = document.getElementById('copyButton');
            const copyFeedback = document.getElementById('copyFeedback');

            const cleanInput = input.replace(/[^A-Z0-9]/gi, '');
            if (cleanInput.length !== 12) {
                output.textContent = 'Endereço MAC inválido! Insira exatamente 12 caracteres alfanuméricos.';
                output.classList.add('text-red-600', 'error-text');
                copyButton.classList.add('hidden');
                copyFeedback.classList.add('hidden');
                return;
            }

            const formattedMac = cleanInput.match(/.{1,2}/g).join(':');
            output.textContent = formattedMac;
            output.classList.remove('text-red-600', 'error-text');
            copyButton.classList.remove('hidden');
            copyFeedback.classList.add('hidden');
        }

        function copyMac() {
            const output = document.getElementById('output').textContent;
            const copyFeedback = document.getElementById('copyFeedback');

            navigator.clipboard.writeText(output).then(() => {
                copyFeedback.classList.remove('hidden');
                setTimeout(() => {
                    copyFeedback.classList.add('hidden');
                }, 2000);
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
                copyFeedback.textContent = 'Erro ao copiar!';
                copyFeedback.classList.remove('hidden');
                copyFeedback.classList.add('text-red-600', 'error-text');
                setTimeout(() => {
                    copyFeedback.classList.add('hidden');
                    copyFeedback.classList.remove('text-red-600', 'error-text');
                    copyFeedback.textContent = 'Copiado para a área de transferência!';
                }, 2000);
            });
        }

        // Serial Converter Functions
        const modelConfig = {
            'Intelbras': { prefix: '49544253' },
            'FiberHome': { prefix: '46485454' },
            'Easy4link': { prefix: '46485454' },
            'ZTE': { prefix: '5A544547' },
            'VSOL': { prefix: '47504F4E' },
            'Nokia': { prefix: '4E42454C' },
            'Multilaser': { prefix: '44443136' },
            'Alcatel': { prefix: '414C434C' },
            'Tenda': { prefix: '32303037' },
            'Monu': { prefix: '4D4F4E55' },
            'Ubiquiti': { prefix: '55424E54' },
            'Huawei': { prefix: '48575443' }
        };

        function convertToSerialNumber() {
            const model = document.getElementById('modelSelect').value;
            const serialInput = document.getElementById('serialInput').value.trim().toUpperCase();
            const serialOutput = document.getElementById('serialOutput');
            const copySerialButton = document.getElementById('copySerialButton');
            const serialCopyFeedback = document.getElementById('serialCopyFeedback');

            const cleanSerial = serialInput.replace(/[^A-Z0-9]/gi, '');
            const config = modelConfig[model] || {};

            // Validação do input
            if (cleanSerial.length < 8) {
                serialOutput.textContent = 'MAC inválido! Insira um MAC com pelo menos 8 caracteres alfanuméricos (ex.: ZTEGD5F27DBF).';
                serialOutput.classList.add('text-red-600', 'error-text');
                copySerialButton.classList.add('hidden');
                serialCopyFeedback.classList.add('hidden');
                return;
            }

            // Extrai os últimos 8 caracteres e concatena com o prefixo do modelo
            const serialLast8 = cleanSerial.slice(-8);
            const concatenated = config.prefix + serialLast8;
            serialOutput.textContent = concatenated;
            serialOutput.classList.remove('text-red-600', 'error-text');
            copySerialButton.classList.remove('hidden');
            serialCopyFeedback.classList.add('hidden');
        }

        function copySerial() {
            const serialOutput = document.getElementById('serialOutput').textContent;
            const serialCopyFeedback = document.getElementById('serialCopyFeedback');

            navigator.clipboard.writeText(serialOutput).then(() => {
                serialCopyFeedback.classList.remove('hidden');
                setTimeout(() => {
                    serialCopyFeedback.classList.add('hidden');
                }, 2000);
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
                serialCopyFeedback.textContent = 'Erro ao copiar!';
                serialCopyFeedback.classList.remove('hidden');
                serialCopyFeedback.classList.add('text-red-600', 'error-text');
                setTimeout(() => {
                    serialCopyFeedback.classList.add('hidden');
                    serialCopyFeedback.classList.remove('text-red-600', 'error-text');
                    serialCopyFeedback.textContent = 'Copiado para a área de transferência!';
                }, 2000);
            });
        }

        // Event Listeners
        document.getElementById('macInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                convertMac();
            }
        });

        document.getElementById('serialInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                convertToSerialNumber();
            }
        });
    </script>
</body>
</html>
