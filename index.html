<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row =>
                    row.some(cell => cell !== '' && cell !== null && cell !== undefined)
                );

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAC Address Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">MAC Address Converter</h1>
        <div class="mb-4">
            <label for="macInput" class="block text-sm font-medium text-gray-700 mb-2">
                Enter MAC Address (e.g., FHTT10889E48)
            </label>
            <input
                type="text"
                id="macInput"
                placeholder="FHTT10889E48"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
        </div>
        <button
            onclick="convertMac()"
            class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition duration-200"
        >
            Convert
        </button>
        <div id="result" class="mt-6 text-center">
            <p class="text-gray-700">Converted MAC Address:</p>
            <p id="output" class="text-lg font-mono text-gray-900 mt-2"></p>
        </div>
    </div>

    <script>
        function convertMac() {
            const input = document.getElementById('macInput').value.trim().toUpperCase();
            const output = document.getElementById('output');

            // Remove any non-alphanumeric characters
            const cleanInput = input.replace(/[^A-Z0-9]/gi, '');

            // Check if input is valid (12 characters)
            if (cleanInput.length !== 12) {
                output.textContent = 'Invalid MAC Address! Please enter exactly 12 alphanumeric characters.';
                output.classList.add('text-red-600');
                return;
            }

            // Convert to format with colons
            const formattedMac = cleanInput.match(/.{1,2}/g).join(':');
            output.textContent = formattedMac;
            output.classList.remove('text-red-600');
        }

        // Add event listener for Enter key
        document.getElementById('macInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                convertMac();
            }
        });
    </script>
</body>
</html>
